name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install native toolchain
        run: brew install node sqlcipher openssl@4 gitleaks

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- bun.lock

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Isolated 10,000-note performance gate
        run: bun run test:quality

      - name: Dependency audit
        run: bun run audit

      - name: Secret scan
        run: gitleaks git --redact --no-banner
